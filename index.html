<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com; frame-src https://floxaap-d7a1a.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#03110C;--sf:#07201A;--sf2:#0C2D21;--ink:#F4ECD3;--mut:#8FAC9E;--gold:#E3C25B;--line:#12372A;--bad:#E58A7A;--grad:linear-gradient(135deg,#F1D98A,#C9A227 55%,#9A7710)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;touch-action:manipulation}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--sf);min-height:52px}
header[hidden],nav[hidden]{display:none}
.logo{font-size:24px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.ttl{font-weight:700;font-size:17px}
main{flex:1;overflow:auto;overscroll-behavior:contain;padding:0}
main.chatmode{display:flex;flex-direction:column;overflow:hidden}
nav{display:flex;border-top:1px solid var(--line);background:var(--sf);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:10px 0;background:none;border:0;color:var(--mut);cursor:pointer;display:grid;place-items:center}
nav button.on{color:var(--gold)}
.ic{width:26px;height:26px;display:block}
.ib{background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);display:grid;place-items:center;border-radius:50%}
.ib .ic{width:25px;height:25px}
.ib.liked{color:#FF5C7A}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.av{border-radius:50%;background:var(--grad);color:#04150F;display:grid;place-items:center;font-weight:800;flex:none}
.mut{color:var(--mut);font-size:13px}.c{text-align:center;padding:24px 12px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
input,textarea{width:100%;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:4px 0;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
.btn{background:var(--grad);color:#04150F;border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.o{background:none;color:var(--gold);border:1px solid var(--gold)}
.lnk{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px 0}
.err{color:var(--bad);min-height:20px;font-size:14px}
.auth{max-width:380px;margin:auto;padding:40px 24px;text-align:center}
.auth .logo{font-size:44px;margin-bottom:6px}
.auth .card{text-align:start;margin-top:20px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font-weight:700;cursor:pointer}
.tabs button.on{color:var(--gold);border-color:var(--gold)}
.sg{padding:10px 0 4px;border-bottom:1px solid var(--line)}
.sgt{padding:0 14px 6px;font-weight:700}
.sgr{display:flex;gap:10px;overflow-x:auto;padding:0 14px 10px}
.sc{flex:none;width:130px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sc .btn{width:100%;margin-top:4px;padding:6px}
.post{border-bottom:1px solid var(--line);padding:10px 0 6px}
.ph{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
.ph [data-u]{cursor:pointer}
.pimg{position:relative;background:var(--sf2);user-select:none}
.pimg img{width:100%;max-height:78vh;object-fit:cover;display:block}
.burst{position:absolute;inset:0;display:grid;place-items:center;color:#fff;pointer-events:none;opacity:0}
.burst .ic{width:96px;height:96px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.burst.go{animation:pop .8s ease}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.pa{display:flex;gap:4px;padding:6px 8px 0}
.lc{padding:0 14px;font-weight:700;font-size:14px}
.pt{padding:2px 14px;white-space:pre-wrap;word-break:break-word}
.pt.big{font-size:18px;line-height:1.7;padding:6px 14px 4px}
.vc{padding:2px 14px;font-size:13px}
.pf{padding:16px 14px;border-bottom:1px solid var(--line)}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:18px}.stats span{color:var(--mut);font-size:13px}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
.sbox{display:flex;align-items:center;gap:8px;margin:12px;padding:0 12px;background:var(--sf2);border:1px solid var(--line);border-radius:14px;color:var(--mut)}
.sbox input{border:0;background:none;margin:0;padding:12px 0}
.ur{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.ur .btn{padding:6px 12px}
.msgs{display:flex;flex-direction:column;gap:6px;flex:1;overflow:auto;padding:12px}
.m{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--sf2);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{background:#0F6B4F;align-self:flex-end}
.m small{display:block;color:var(--mut);font-size:10px;margin-top:2px}
.bar{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--sf)}
#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;max-width:520px;margin:auto}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet .sh{position:relative;background:var(--sf);border-radius:20px 20px 0 0;max-height:88dvh;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.shh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.shb{padding:14px 16px;overflow:auto;min-height:80px}
.cm{display:flex;gap:10px;padding:8px 0}
.cm p{margin:0;white-space:pre-wrap;word-break:break-word}
.pv{width:100%;border-radius:12px;margin:8px 0;max-height:240px;object-fit:cover}
.pill{display:block;width:100%;padding:14px;border-radius:999px;border:1px solid var(--gold);background:none;color:var(--gold);font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.pill.gold{background:var(--grad);color:#04150F;border:0}.pill:disabled{opacity:.5}
.wl{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:calc(env(safe-area-inset-top,0px) + 56px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);background:radial-gradient(120% 55% at 50% 0%,#0F4A38 0%,transparent 70%)}
.wl-top{text-align:center}.wl-h{font-size:42px;margin:14px 0 6px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-p{color:var(--mut);font-size:17px;max-width:300px;margin:0 auto}
.wl-feat{display:flex;justify-content:space-around;margin-bottom:20px;color:var(--gold)}.wl-feat div{display:grid;place-items:center;gap:4px}.wl-feat span{color:var(--mut);font-size:13px}
.af{padding:calc(env(safe-area-inset-top,0px) + 14px) 24px 24px;max-width:420px;margin:auto}
.af .ib{margin-inline-start:-6px}.af h2{margin:14px 0 2px;font-size:26px}
.pw{position:relative}.pw .lnk{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gold)}
.err.good{color:#6FD6A8}
.splash{height:100%;display:grid;place-content:center;justify-items:center;gap:18px}
.splash .dots{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--gold);color:var(--ink);padding:10px 18px;border-radius:24px;z-index:50;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
.sk{height:14px;border-radius:8px;margin:10px 14px;background:linear-gradient(90deg,var(--sf) 25%,var(--sf2) 50%,var(--sf) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app"><header id="hdr" hidden></header><main id="main"><div class="splash"><div class="logo" style="font-size:40px">Floxaap</div><div class="dots"></div></div></main><nav id="nav" hidden></nav></div>
<div id="toast"></div>
<script type="module">
const CFG={
  apiKey:"AIzaSyAgIffss9riDmNtwtRiTL-bxM3Ylju3PXE",
  authDomain:"floxaap-d7a1a.firebaseapp.com",
  projectId:"floxaap-d7a1a",
  storageBucket:"floxaap-d7a1a.firebasestorage.app",
  messagingSenderId:"363200418804",
  appId:"1:363200418804:web:8942848d201d267a811fa1"
};
const $=s=>document.querySelector(s),main=$("#main"),nav=$("#nav"),hdr=$("#hdr");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const V="10.14.1",G=`https://www.gstatic.com/firebasejs/${V}/`;
let FA,A,F;
try{[FA,A,F]=await Promise.all([import(G+"firebase-app.js"),import(G+"firebase-auth.js"),import(G+"firebase-firestore.js")])}
catch(e){main.innerHTML=`<div class="auth"><div class="logo">Floxaap</div><p class="err">تعذّر تحميل Firebase. تأكد من الإنترنت وأعد تحميل الصفحة.</p></div>`;throw e}
const {doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,orderBy,limit,onSnapshot,getDocs,serverTimestamp,arrayUnion,arrayRemove,runTransaction}=F;
const app=FA.initializeApp(CFG),auth=A.getAuth(app),db=F.initializeFirestore(app,{experimentalAutoDetectLongPolling:true});

// ---------- أدوات ----------
const PATHS={
home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
add:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
comment:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>',
back:'<path d="M9 6l6 6-6 6"/>',
x:'<path d="M18 6L6 18M6 6l12 12"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
img:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>'};
const IC=(n,fill)=>`<svg class="ic" viewBox="0 0 24 24" fill="${fill?"currentColor":"none"}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${PATHS[n]}</svg>`;
const ini=n=>esc((n||"?").trim()[0]?.toUpperCase());
const av=(n,s=42)=>`<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px">${ini(n)}</div>`;
const ms=t=>t?.toMillis?.()||Date.now();
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return"الآن";if(s<3600)return`منذ ${Math.floor(s/60)} د`;if(s<86400)return`منذ ${Math.floor(s/3600)} س`;if(s<604800)return`منذ ${Math.floor(s/86400)} يوم`;return new Date(t).toLocaleDateString("ar")};
const cid=(a,b)=>[a,b].sort().join("_");
const safeImg=s=>typeof s==="string"&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s);
const skel=n=>Array.from({length:n||4},(_,i)=>`<div class="sk" style="width:${90-i*12}%;height:${i?14:80}px"></div>`).join("");
const errMsg=e=>({"permission-denied":"ما عندك صلاحية — تأكد أنك نشرت القواعد الجديدة (firestore.rules)","unavailable":"مشكلة بالاتصال بالإنترنت","failed-precondition":"Firestore يطلب فهرساً — افتح الرابط الظاهر بالكونسول"})[e.code]||("خطأ: "+(e.code||e.message));
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)};

// ---------- الحالة ----------
let me=null,following=new Set(),subs=[],fsub=null,signing=false,pendingMsg="";
let stack=[],RT=0,cache=[],repaint=()=>{},onFol=null,msub=null,feedMode="all";
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
const stop=()=>{subs.forEach(u=>u());subs=[]};

// ---------- نافذة سفلية ----------
function sheet(html){closeSheet();const s=document.createElement("div");s.id="sheet";s.innerHTML=`<div class="bd" data-x></div><div class="sh">${html}</div>`;document.body.appendChild(s);s.addEventListener("click",e=>{if(e.target.closest("[data-x]"))closeSheet()});return s}
function closeSheet(){if(msub){msub();msub=null}$("#sheet")?.remove()}

// ---------- الدخول ----------
A.onAuthStateChanged(auth,u=>{if(!signing)boot(u)});
async function boot(u){
  stop();if(fsub){fsub();fsub=null}closeSheet();
  if(!u){me=null;following=new Set();stack=[];nav.hidden=true;hdr.hidden=true;main.className="";const m=pendingMsg;pendingMsg="";return authView(m)}
  try{
    let s=await getDoc(doc(db,"users",u.uid));
    for(let i=0;!s.exists()&&i<8;i++){await new Promise(r=>setTimeout(r,400));s=await getDoc(doc(db,"users",u.uid))}
    if(!s.exists()){pendingMsg="تعذّر تحميل الحساب، أعد المحاولة";return A.signOut(auth)}
    me={uid:u.uid,...s.data()};
    fsub=onSnapshot(collection(db,"users",me.uid,"following"),q=>{following=new Set(q.docs.map(d=>d.id));onFol&&onFol()},()=>{});
    nav.hidden=false;hdr.hidden=false;tabTo("feed");
  }catch(e){pendingMsg=errMsg(e);A.signOut(auth)}
}

let lgN=0;
const LOGO=(sz=64)=>{const g="lg"+(++lgN);return `<svg width="${sz}" height="${sz}" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D98A"/><stop offset=".55" stop-color="#C9A227"/><stop offset="1" stop-color="#9A7710"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#04150F"/><circle cx="256" cy="256" r="178" fill="none" stroke="url(#${g})" stroke-width="26"/><path d="M196 150h140v38H242v52h82v38h-82v84h-46z" fill="url(#${g})"/></svg>`};

function authView(msg=""){
  let reg=false;
  const welcome=()=>{
    main.innerHTML=`<div class="wl"><div class="wl-top">${LOGO(92)}<div class="wl-h">Floxaap</div><p class="wl-p">شارك لحظاتك، تابع أصدقاءك، وتراسلوا بسهولة.</p></div>
    <div><div class="wl-feat"><div>${IC("heart")}<span>إعجابات</span></div><div>${IC("comment")}<span>تعليقات</span></div><div>${IC("send")}<span>رسائل</span></div><div>${IC("user")}<span>أصدقاء</span></div></div>
    <button class="pill gold" id="gr">إنشاء حساب</button><button class="pill" id="gi">لدي حساب — تسجيل الدخول</button></div></div>`;
    $("#gr").onclick=()=>{reg=true;form()};$("#gi").onclick=()=>{reg=false;form()};
  };
  const form=()=>{
    main.innerHTML=`<div class="af"><button class="ib" id="ab" aria-label="رجوع">${IC("back")}</button><div style="margin-top:6px">${LOGO(52)}</div>
    <h2>${reg?"أنشئ حسابك":"أهلاً بعودتك"}</h2><div class="mut">${reg?"ثواني وتصير جاهز":"سجّل الدخول لتتابع أصدقاءك"}</div>
    <div style="margin-top:16px">
    ${reg?`<input id="nm" maxlength="40" placeholder="الاسم" autocomplete="name"><input id="un" dir="ltr" maxlength="20" placeholder="اسم المستخدم (a-z 0-9 _)" autocapitalize="none" autocomplete="off">`:""}
    <input id="em" dir="ltr" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <div class="pw"><input id="pw" dir="ltr" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="${reg?"new-password":"current-password"}" style="padding-right:72px"><button class="lnk" id="eye" type="button">إظهار</button></div>
    <div class="err" id="er">${esc(msg)}</div>
    <button class="pill gold" id="go" style="margin-top:4px">${reg?"إنشاء حساب":"دخول"}</button>
    ${reg?"":`<p class="c" style="padding:12px 0 0"><button class="lnk" id="fg">نسيت كلمة المرور؟</button></p>`}
    <p class="c mut" style="padding:8px 0">${reg?"عندك حساب؟":"جديد هنا؟"} <button class="lnk" id="sw" style="color:var(--gold);font-weight:700">${reg?"سجّل الدخول":"أنشئ حساباً"}</button></p></div></div>`;
    msg="";
    const say=(t,good)=>{const e=$("#er");if(e){e.textContent=t;e.className="err"+(good?" good":"")}};
    $("#ab").onclick=welcome;
    $("#sw").onclick=()=>{reg=!reg;form()};
    $("#eye").onclick=()=>{const i=$("#pw"),h=i.type==="password";i.type=h?"text":"password";$("#eye").textContent=h?"إخفاء":"إظهار"};
    if($("#fg"))$("#fg").onclick=async()=>{const em=$("#em").value.trim();if(!em)return say("اكتب بريدك الإلكتروني أولاً");
      try{await A.sendPasswordResetEmail(auth,em);say("أرسلنا رابط إعادة التعيين لبريدك (تفقد الرسائل غير المرغوبة أيضاً)",true)}
      catch(e){say(e.code==="auth/invalid-email"?"البريد غير صالح":e.code==="auth/network-request-failed"?"مشكلة بالاتصال بالإنترنت":"تعذّر الإرسال: "+(e.code||e.message))}};
    $("#go").onclick=async()=>{
      const em=$("#em").value.trim(),pw=$("#pw").value;say("");
      const btn=$("#go");btn.disabled=true;
      try{
        if(!reg){await A.signInWithEmailAndPassword(auth,em,pw);return}
        const nm=$("#nm").value.trim(),un=$("#un").value.trim().toLowerCase();
        if(!nm)return say("اكتب اسمك");
        if(!/^[a-z0-9_]{3,20}$/.test(un))return say("اسم المستخدم: 3-20 حرفاً إنجليزياً أو أرقاماً أو _");
        if(pw.length<6)return say("كلمة المرور 6 أحرف على الأقل");
        signing=true;
        const c=await A.createUserWithEmailAndPassword(auth,em,pw);
        try{
          await runTransaction(db,async t=>{
            const r=doc(db,"usernames",un);
            if((await t.get(r)).exists())throw new Error("taken");
            t.set(r,{uid:c.user.uid});
            t.set(doc(db,"users",c.user.uid),{name:nm,username:un,username_lower:un,bio:"",createdAt:serverTimestamp()});
          });
        }catch(e){try{await c.user.delete()}catch{}throw e}
        signing=false;await boot(c.user);toast("أهلاً "+nm+" 🎉 ابدأ بمتابعة أصدقائك");
      }catch(e){
        signing=false;
        say(({"auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة","auth/invalid-login-credentials":"البريد أو كلمة المرور غير صحيحة","auth/missing-password":"اكتب كلمة المرور","auth/email-already-in-use":"البريد مستخدم من قبل","auth/weak-password":"كلمة المرور ضعيفة","auth/invalid-email":"البريد غير صالح","auth/too-many-requests":"محاولات كثيرة، انتظر قليلاً","auth/network-request-failed":"مشكلة بالاتصال بالإنترنت","auth/operation-not-allowed":"فعّل Email/Password من Firebase Authentication","taken":"اسم المستخدم محجوز"})[e.code||e.message]||("حدث خطأ: "+(e.code||e.message)));
      }finally{const b=$("#go");if(b)b.disabled=false}
    };
  };
  msg?form():welcome();
}

// ---------- التنقل ----------
nav.innerHTML=[["feed","home"],["search","search"],["add","add"],["chats","send"],["me","user"]].map(([k,i])=>`<button data-t="${k}" aria-label="${k}">${IC(i)}</button>`).join("");
nav.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t==="add")return composer();tabTo(b.dataset.t)};
hdr.onclick=e=>{const g=e.target.closest("[data-go]"),u=e.target.closest("[data-u]");if(e.target.closest("#bk"))return back();if(g)tabTo(g.dataset.go);else if(u)openProfile(u.dataset.u)};
const setHdr=(l,r="")=>{hdr.hidden=false;hdr.innerHTML=`<div class="grow row">${l}</div>${r}`};
const hdrBack=l=>{setHdr(`<button class="ib" id="bk" aria-label="رجوع">${IC("back")}</button>${l}`)};
function tabTo(v){stack=[{v,p:{}}];render(stack[0])}
function push(v,p){stack.push({v,p});history.pushState(null,"");render(stack[stack.length-1])}
function back(){if(stack.length>1)history.back();else tabTo("feed")}
addEventListener("popstate",()=>{if(stack.length>1){stack.pop();render(stack[stack.length-1])}});
const openProfile=id=>id===me.uid?tabTo("me"):push("profile",{id});
const VIEWS={feed:()=>feed(),search:()=>search(),chats:()=>chats(),me:t=>profile({id:me.uid},t),profile:(p,t)=>profile(p,t),chat:(p,t)=>chatV(p,t)};
function render(c){
  stop();closeSheet();onFol=null;cache=[];repaint=()=>{};const t=++RT;
  main.className="";main.scrollTop=0;nav.hidden=c.v==="chat";
  nav.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===stack[0].v));
  const fail=e=>{console.error(e);if(t===RT)main.innerHTML=`<p class="err c">${esc(errMsg(e))}</p>`};
  try{const r=VIEWS[c.v](c.p,t);if(r&&r.catch)r.catch(fail)}catch(e){fail(e)}
}

// ---------- منشورات ----------
function reconcile(box,items,html){
  const old=new Map([...box.children].filter(c=>c.dataset.k).map(c=>[c.dataset.k,c]));
  const out=items.map(it=>{const h=html(it);let el=old.get(it.id);
    if(!el||el.dataset.sig!==h){const t=document.createElement("div");t.innerHTML=h;el=t.firstElementChild;el.dataset.k=it.id;el.dataset.sig=h}
    return el});
  box.replaceChildren(...out);
}
const renderPosts=(box,L,empty)=>{if(!box)return;L.length?reconcile(box,L,postHTML):(box.innerHTML=empty)};
function postHTML(p){
  const lk=(p.likes||[]).includes(me.uid),n=(p.likes||[]).length,id=esc(p.id),ow=esc(p.uid),img=safeImg(p.image);
  return `<article class="post"><div class="ph"><div class="row grow" data-u="${ow}">${av(p.name,38)}<div class="grow"><b>${esc(p.name)}</b><div class="mut ell" dir="ltr" style="text-align:start">@${esc(p.username)} · ${ago(ms(p.ts))}</div></div></div>${p.uid===me.uid?`<button class="ib" data-del="${id}" aria-label="حذف">${IC("trash")}</button>`:""}</div>
  ${img?`<div class="pimg" data-dbl="${id}"><img alt="" src="${p.image}"><div class="burst">${IC("heart",1)}</div></div>`:""}
  <div class="pa"><button class="ib ${lk?"liked":""}" data-lk="${id}" aria-label="إعجاب">${IC("heart",lk)}</button><button class="ib" data-cm="${id}" data-ow="${ow}" aria-label="تعليق">${IC("comment")}</button></div>
  <div class="lc">${n?`${n} إعجاب`:"كن أول من يعجبه"}</div>
  ${p.text?`<div class="pt ${img?"":"big"}">${img?`<b>${esc(p.name)}</b> `:""}${esc(p.text)}</div>`:""}
  <div class="vc"><button class="lnk" data-cm="${id}" data-ow="${ow}">عرض التعليقات</button></div></article>`;
}
async function like(id,force){
  const p=cache.find(x=>x.id===id);if(!p)return;
  const prev=p.likes||[],on=prev.includes(me.uid);if(force&&on)return;
  p.likes=on?prev.filter(x=>x!==me.uid):[...prev,me.uid];repaint();
  try{await updateDoc(doc(db,"posts",id),{likes:on?arrayRemove(me.uid):arrayUnion(me.uid)})}
  catch(e){p.likes=prev;repaint();toast(errMsg(e))}
}
let lastTap=0;
function postEvents(box){
  box.onclick=async e=>{
    const t=e.target.closest("[data-del],[data-lk],[data-cm],[data-u],[data-dbl]");if(!t)return;
    if(t.dataset.del){if(confirm("حذف المنشور؟"))try{await deleteDoc(doc(db,"posts",t.dataset.del));toast("تم الحذف")}catch(er){toast(errMsg(er))}}
    else if(t.dataset.lk)like(t.dataset.lk);
    else if(t.dataset.cm)comments(t.dataset.cm,t.dataset.ow);
    else if(t.dataset.dbl){const now=Date.now();
      if(now-lastTap<350){lastTap=0;const id=t.dataset.dbl;like(id,true);
        const b=box.querySelector(`[data-dbl="${CSS.escape(id)}"] .burst`);if(b){b.classList.remove("go");void b.offsetWidth;b.classList.add("go")}}
      else lastTap=now}
    else if(t.dataset.u)openProfile(t.dataset.u);
  };
}
async function toggleFollow(id){
  const r=doc(db,"users",me.uid,"following",id),was=following.has(id);
  was?following.delete(id):following.add(id);onFol&&onFol();
  try{was?await deleteDoc(r):await setDoc(r,{at:serverTimestamp()})}
  catch(e){was?following.add(id):following.delete(id);onFol&&onFol();toast(errMsg(e))}
}

  postEvents($("#ps"));
  getDocs(query(collection(db,"users"),orderBy("createdAt","desc"),limit(20))).then(s=>{sug=s.docs.filter(d=>d.id!==me.uid).map(d=>({id:d.id,...d.data()}));sugDraw()}).catch(()=>{});
  subs.push(onSnapshot(query(collection(db,"posts"),orderBy("ts","desc"),limit(200)),q=>{

// ---------- بحث ----------
function search(){
  setHdr(`<div class="ttl">بحث</div>`);
  main.innerHTML=`<div class="sbox">${IC("search")}<input id="q" dir="ltr" placeholder="ابحث باسم المستخدم..." autocapitalize="none" autocomplete="off"></div><div id="rs">${skel(4)}</div>`;
  let tm,last=[],title="أشخاص جدد";
  const draw=()=>{$("#rs").innerHTML=last.length?`<div class="mut" style="padding:0 14px 6px">${title}</div>`+last.map(u=>`<div class="ur" data-u="${esc(u.id)}">${av(u.name,46)}<div class="grow"><b class="ell">${esc(u.name)}</b><div class="mut ell" dir="ltr" style="text-align:start">@${esc(u.username)}</div></div>
    <button class="btn ${following.has(u.id)?"o":""}" data-f="${esc(u.id)}">${following.has(u.id)?"إلغاء المتابعة":"متابعة"}</button><button class="ib" data-m="${esc(u.id)}" aria-label="رسالة">${IC("send")}</button></div>`).join(""):`<p class="mut c">لا نتائج</p>`};
  async function run(){
    const q=$("#q").value.trim().toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,"");
    try{
      const base=collection(db,"users");
      const s=await getDocs(q?query(base,where("username_lower",">=",q),where("username_lower","<=",q+"\uf8ff"),limit(20)):query(base,orderBy("createdAt","desc"),limit(20)));
      title=q?"النتائج":"أشخاص جدد";last=s.docs.filter(d=>d.id!==me.uid).map(d=>({id:d.id,...d.data()}));draw();
    }catch(e){$("#rs").innerHTML=`<p class="err c">${esc(errMsg(e))}</p>`}
  }
  onFol=draw;$("#q").oninput=()=>{clearTimeout(tm);tm=setTimeout(run,300)};
  $("#rs").onclick=e=>{
    const f=e.target.closest("[data-f]");if(f)return toggleFollow(f.dataset.f);
    const m=e.target.closest("[data-m]");if(m){const u=last.find(x=>x.id===m.dataset.m);return u&&push("chat",{u:{id:u.id,name:u.name}})}
    const r=e.target.closest("[data-u]");if(r)openProfile(r.dataset.u)};
  run();
}

async function chatV({u},t){
  const id=cid(me.uid,u.id),ref=doc(db,"chats",id);
  hdrBack(`<div class="row grow" data-u="${esc(u.id)}" style="cursor:pointer">${av(u.name,34)}<b class="ell">${esc(u.name)}</b></div>`);
  main.className="chatmode";
  main.innerHTML=`<div class="msgs" id="ms"><div class="mut c">...</div></div><div class="bar"><input id="mt" maxlength="2000" placeholder="اكتب رسالة..." autocomplete="off" style="margin:0"><button class="btn" id="sd">إرسال</button></div>`;
  try{const s=await getDoc(ref);if(t!==RT)return;
    if(!s.exists())await setDoc(ref,{members:[me.uid,u.id].sort(),names:{[me.uid]:me.name,[u.id]:u.name}})}
  catch(e){if(t===RT)$("#ms").innerHTML=`<p class="err c">${esc(errMsg(e))}</p>`;return}
  if(t!==RT)return;
  const send=async()=>{const text=$("#mt").value.trim();if(!text)return;$("#mt").value="";
    try{await addDoc(collection(db,"chats",id,"messages"),{from:me.uid,text,ts:serverTimestamp()});
      await updateDoc(ref,{last:text,updated:serverTimestamp()})}
    catch(e){$("#mt").value=text;toast(errMsg(e))}};
  $("#sd").onclick=send;$("#mt").onkeydown=e=>{if(e.key==="Enter")send()};

    const b=$("#ms");if(!b)return;
    b.innerHTML=q.docs.length?q.docs.map(d=>{const m=d.data();return`<div class="m ${m.from===me.uid?"me":""}">${esc(m.text)}<small>${new Date(ms(m.ts)).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})}</small></div>`}).join(""):`<p class="mut c">ابدأ المحادثة 👋</p>`;
    b.scrollTop=b.scrollHeight},e=>{$("#ms").innerHTML=`<p class="err c">${esc(errMsg(e))}</p>`}));
}

// ---------- الملف الشخصي ----------
async function profile({id},t){
  const self=id===me.uid;
  self?setHdr(`<div class="ttl" dir="ltr">@${esc(me.username)}</div>`):hdrBack("");
  main.innerHTML=`<div class="pf" id="pf">${skel(3)}</div><div id="ps"></div>`;
  let u;
  try{const s=await getDoc(doc(db,"users",id));if(t!==RT)return;
    if(!s.exists()){$("#pf").innerHTML=`<p class="mut c">الحساب غير موجود</p>`;return}
    u={id,...s.data()}}
  catch(e){if(t===RT)$("#pf").innerHTML=`<p class="err c">${esc(errMsg(e))}</p>`;return}
  if(!self)hdrBack(`<div class="ttl" dir="ltr">@${esc(u.username)}</div>`);
  let list=[];
  const head=()=>{const likes=list.reduce((a,p)=>a+(p.likes||[]).length,0),f=following.has(id);
    $("#pf").innerHTML=`<div class="row">${av(u.name,76)}<div class="stats"><div><b>${list.length}</b><span>منشور</span></div><div><b>${likes}</b><span>إعجاب</span></div>${self?`<div><b>${following.size}</b><span>يتابع</span></div>`:""}</div></div>
    <div style="margin-top:10px"><b>${esc(u.name)}</b></div>${u.bio?`<div style="white-space:pre-wrap;word-break:break-word">${esc(u.bio)}</div>`:""}
    <div class="acts">${self?`<button class="btn o" data-ed>تعديل الملف</button><button class="btn o" data-lo>تسجيل الخروج</button>`:`<button class="btn ${f?"o":""}" data-f>${f?"إلغاء المتابعة":"متابعة"}</button><button class="btn o" data-m>رسالة</button>`}</div>`};
  head();
  $("#pf").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if("f"in b.dataset)toggleFollow(id);
    else if("m"in b.dataset)push("chat",{u:{id,name:u.name}});
    else if("ed"in b.dataset)editProfile();
    else if("lo"in b.dataset){if(confirm("تسجيل الخروج؟"))A.signOut(auth)}};
  const empty=`<div class="c mut">${self?"لم تنشر شيئاً بعد. اضغط ＋":"لا منشورات بعد"}</div>`;
  repaint=()=>renderPosts($("#ps"),list,empty);onFol=()=>{head();};

    list=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b.ts)-ms(a.ts));cache=list;head();repaint()},
    e=>{$("#ps").innerHTML=`<p class="err c">${esc(errMsg(e))}</p>`}));
}

// ---------- منشور جديد ----------
function compress(file){
  return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error("تعذّر قراءة الصورة"));
    r.onload=()=>{const i=new Image();i.onerror=()=>no(new Error("الملف ليس صورة صالحة"));
      i.onload=()=>{for(const [mx,q] of [[1080,.75],[900,.65],[720,.55],[560,.45]]){
        const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");
        c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
        const d=c.toDataURL("image/jpeg",q);if(d.length<=650000)return ok(d)}
        no(new Error("الصورة كبيرة جداً"))};
      i.src=r.result};r.readAsDataURL(file)});
}
function composer(){
  sheet(`<div class="shh"><b>منشور جديد</b><button class="ib" data-x aria-label="إغلاق">${IC("x")}</button></div><div class="shb"><textarea id="tx" rows="4" maxlength="1000" placeholder="بماذا تفكر؟"></textarea><div class="mut" id="cnt" style="text-align:end">0 / 1000</div><div id="pv"></div>
  <div class="row" style="justify-content:space-between;margin-top:6px"><label class="btn o row" for="im" style="gap:6px">${IC("img")}<span>صورة</span></label><input id="im" type="file" accept="image/*" hidden><button class="btn" id="pb" style="padding:9px 28px">نشر</button></div><div class="err" id="er"></div></div>`);
  let img="",busy=false;
  $("#tx").oninput=()=>{$("#cnt").textContent=$("#tx").value.length+" / 1000"};
  $("#im").onchange=async()=>{const f=$("#im").files[0];if(!f)return;busy=true;$("#er").textContent="جارٍ تجهيز الصورة...";
    try{img=await compress(f);$("#pv").innerHTML=`<img class="pv" alt="" src="${img}">`;$("#er").textContent=""}
    catch(e){img="";$("#pv").innerHTML="";$("#er").textContent=e.message}busy=false};
  $("#pb").onclick=async()=>{const text=$("#tx").value.trim();if(busy)return;if(!text&&!img)return $("#er").textContent="اكتب شيئاً أو أضف صورة";
    $("#pb").disabled=true;$("#er").textContent="";
    try{await addDoc(collection(db,"posts"),{uid:me.uid,name:me.name,username:me.username,text,image:img,likes:[],ts:serverTimestamp()});
      closeSheet();toast("تم النشر ✓")}
    catch(e){$("#er").textContent=errMsg(e);$("#pb").disabled=false}};
}

    e=>{const b=$("#cml");if(b)b.innerHTML=`<p class="err c">${esc(errMsg(e))}</p>`});
}
