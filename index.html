function showAuth(mode="in"){
  stopAll();HDR.hidden=true;NAV.hidden=true;
  const su=mode==="up";
  V.innerHTML=`<div class="auth"><img src="icon-512.png" alt=""><h1>Floxaap</h1><div class="mut">More Than Social Media ✨</div>
  <div class="card">${su?'<input id="nm" placeholder="الاسم" maxlength="40" autocomplete="name">':''}

  <input id="pw" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="${su?'new-password':'current-password'}">
  <div class="err" id="er"></div><button class="btn" id="go">${su?"إنشاء حساب":"تسجيل الدخول"}</button>
  <button class="lnk" id="sw">${su?"لدي حساب بالفعل":"إنشاء حساب جديد"}</button><button class="lnk mut" id="bk0">رجوع</button></div></div>`;
  $("#bk0").onclick=showWelcome;hideSplash();
  $("#sw").onclick=()=>showAuth(su?"in":"up");
  const go=$("#go"),er=$("#er");
  go.onclick=async()=>{
    er.textContent="";const un=$("#un").value.trim().toLowerCase(),pw=$("#pw").value,nm=su?$("#nm").value.trim():"";
    if(!/^[a-z0-9_]{3,20}$/.test(un)){er.textContent="اسم المستخدم: 3-20 حرفاً إنجليزياً أو رقماً أو _";return}
    if(su&&!nm){er.textContent="اكتب اسمك";return}
    go.disabled=true;
    try{
      const email=un+"@floxaap.app";
      if(!su){await signInWithEmailAndPassword(auth,email,pw);return}
      signing=true;
      const cr=await createUserWithEmailAndPassword(auth,email,pw);
      try{
        const b=writeBatch(db),id=cr.user.uid;
        b.set(doc(db,"users",id),{name:nm,username:un,username_lower:un,bio:"",createdAt:serverTimestamp()});
        b.set(doc(db,"usernames",un),{uid:id});
        await b.commit();signing=false;await boot(cr.user);
      }catch(e){signing=false;try{await deleteUser(cr.user)}catch{}throw e}
    }catch(e){signing=false;er.textContent=AERR[e.code]||"تعذر تنفيذ الطلب، حاول مجدداً";go.disabled=false}
  };
}
async function boot(u){
  const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists()){await signOut(auth);return showAuth()}
  me={id:u.uid,...s.data()};
  UC[me.id]=me;buildNav();go("home");hideSplash();startServices();
}
onAuthStateChanged(auth,u=>{if(signing)return;u?boot(u).catch(()=>showAuth()):(stopServices(),me=null,showWelcome())});

function feed(root,s,flt,rd=postHTML,srt){
  const docs=s.docs.filter(flt||(()=>true)).sort(srt||(()=>0)),cur=[...root.querySelectorAll(".post")].map(e=>e.dataset.id);
  if(!docs.length||cur.join()!==docs.map(d=>d.id).join()){root.innerHTML=docs.length?docs.map(rd).join(""):'<div class="empty">لا توجد منشورات بعد<br>كن أول من ينشر ✨</div>';return}
  docs.forEach(d=>{const b=root.querySelector(`[data-id="${d.id}"] [data-a="like"]`),p=d.data();b.classList.toggle("lk",!!p.likes?.includes(me.id));b.querySelector("span").textContent=cnt(p.likes?.length||0)});

function bindPosts(root){
  root.onclick=async e=>{
    const a=e.target.closest(".post");if(!a)return;const id=a.dataset.id,b=e.target.closest("[data-a]");
    if(!b){if(e.target.classList.contains("pimg"))lightbox(e.target.src);return}
    const k=b.dataset.a;
    if(k==="like"){const l=b.classList.contains("lk");updateDoc(doc(db,"posts",id),{likes:l?arrayRemove(me.id):arrayUnion(me.id)}).catch(()=>toast("تعذر الإعجاب"))}
    else if(k==="cm")comments(id);
    else if(k==="bm"){BM.has(id)?BM.delete(id):BM.add(id);b.classList.toggle("on",BM.has(id));try{localStorage.setItem("fx_bm",JSON.stringify([...BM]))}catch{}}
    else if(k==="del"){if(await confirmBox({title:"حذف المنشور؟",text:"لا يمكن التراجع عن الحذف",ok:"حذف"}))deleteDoc(doc(db,"posts",id)).catch(()=>toast("تعذر الحذف"))}
    else if(k==="sh"){const u=location.href;navigator.share?navigator.share({title:"Floxaap",url:u}).catch(()=>{}):(navigator.clipboard?.writeText(u),toast("تم نسخ الرابط"))}
  };
}

  const g={};s.docs.forEach(d=>{const p=d.data({serverTimestamps:"estimate"});if(Date.now()-ms(p.ts)>DAY)return;(g[p.uid]=g[p.uid]||{uid:p.uid,name:p.name,items:[]}).items.push({id:d.id,image:p.image,ts:ms(p.ts)})});
  return Object.values(g).map(x=>(x.items.sort((a,b)=>a.ts-b.ts),x)).sort((a,b)=>b.items[b.items.length-1].ts-a.items[a.items.length-1].ts);
}
function openStories(g,gi){
  let i=0,tm,grp=g[gi];const m=document.createElement("div");m.className="mod sv";document.body.appendChild(m);
  const end=()=>{clearTimeout(tm);m.remove()};
  const next=()=>{if(i<grp.items.length-1){i++;show()}else if(gi<g.length-1){gi++;grp=g[gi];i=0;show()}else end()};
  const show=()=>{clearTimeout(tm);const it=grp.items[i];
    m.innerHTML=`<div class="sbars">${grp.items.map((_,k)=>`<i class="${k<i?"d":k===i?"a":""}"></i>`).join("")}</div><div class="shd">${avh(grp.name,38,grp.uid)}<div class="grow"><b>${esc(grp.name)}</b><div class="mut">${rel(it.ts)}</div></div>${grp.uid===me.id?`<button class="ib" id="sd">${ic("trash")}</button>`:""}<button class="ib" id="sx">${ic("x")}</button></div><img src="${it.image}" alt="">`;
    m.querySelector("#sx").onclick=e=>{e.stopPropagation();end()};
    const sd=m.querySelector("#sd");if(sd)sd.onclick=async e=>{e.stopPropagation();clearTimeout(tm);if(await confirmBox({title:"حذف القصة؟",text:"سيتم حذفها نهائياً",ok:"حذف"})){deleteDoc(doc(db,"stories",it.id)).catch(()=>{});end()}else show()};
    tm=setTimeout(next,5000)};
  m.onclick=next;show();
}
/* ===== المكالمات (WebRTC + Firestore) ===== */
let CALL=null,RC,ringT;
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443"],username:"openrelayproject",credential:"openrelayproject"}]};
const fmtT=s=>[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,"0")).join(":");
const f2=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function ring(on){clearInterval(ringT);if(!on)return;const b=()=>{try{const a=RC||(RC=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.35);navigator.vibrate?.(300)}catch{}};b();ringT=setInterval(b,1600)}
async function logCall(oid,oname,type,dur){
  try{const mem=[me.id,oid].sort(),cr=doc(db,"chats",mem.join("_"));
    if(!(await getDoc(cr)).exists())await setDoc(cr,{members:mem,names:{[me.id]:me.name,[oid]:oname}});
    await addDoc(collection(cr,"messages"),{from:me.id,type:"call",text:type,img:"",audio:"",dur,ts:serverTimestamp()});
    await updateDoc(cr,{last:type==="video"?"📹 مكالمة فيديو":"📞 مكالمة صوتية",updated:serverTimestamp()})}catch{}
}
const getMedia=t=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:t==="video"?{facingMode:"user"}:false});
function callEl(c){const d=document.createElement("div");d.innerHTML=`<video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div class="cui" id="cui"></div>`;d.className="call";document.body.appendChild(d);c.el=d}
function paint(c){
  const u=c.el.querySelector("#cui"),bars=Array.from({length:46},(_,i)=>{const x=(i-22.5)/22.5,h=6+Math.round(62*Math.exp(-x*x*3.2)*(.5+.5*Math.abs(Math.sin(i*1.9))));return `<i style="--h:${h}px;animation-delay:${(i%11)*.09}s"></i>`}).join("");
  c.el.className="call"+(c.state==="live"&&c.type==="video"?" live vid":"");
  const cb=(id,i,l,cls="")=>`<div class="cb"><button class="cbtn ${cls}" id="${id}">${ic(i)}</button><span>${l}</span></div>`;
  const logo=`<div class="ctop"><img src="logo-mark.png" alt=""><b>Floxaap</b></div>`,nm=`<h2 data-vf="${c.oid}">${esc(c.oname)}</h2>`;
  const mu=cb("mu",c.muted?"micoff":"mic","كتم الصوت",c.muted?"on":"");
  if(c.state==="in")u.innerHTML=`${logo}<div class="cmid">${avh(c.oname,170,c.oid)}${nm}<div class="mut">${c.type==="video"?"مكالمة فيديو واردة…":"مكالمة واردة…"}</div></div><div class="cbar">${cb("rj","phone","رفض","red hang")}${cb("ac",c.type==="video"?"video":"phone","قبول","grn")}</div>`;
  else if(c.state==="calling")u.innerHTML=`${logo}<div class="cmid">${avh(c.oname,190,c.oid)}${nm}<div class="mut">${c.msg||"جاري الاتصال…"}</div><div class="wv">${bars}</div></div><div class="cbar">${mu}${cb("en","phone","إنهاء المكالمة","red hang")}${cb("sp","spk","مكبر الصوت")}</div>`;
  else u.innerHTML=`<button class="ib ex" id="ex">${ic("expand")}</button><div class="ctop col"><b>${esc(c.oname)}</b><span class="mut"><span class="sg">▂▄▆</span> <span id="tm">${fmtT(Math.floor((Date.now()-c.t0)/1000))}</span></span></div>${c.type==="video"?"":`<div class="cmid">${avh(c.oname,170,c.oid)}</div>`}<div class="cbar five">${cb("mo","dots","المزيد")}${mu}${cb("en","phone","إنهاء المكالمة","red hang")}${cb("cm","video","كاميرا",c.camOff?"on":"")}${cb("sp","spk","مكبر الصوت")}</div>`;
  const on=(s,f)=>{const b=u.querySelector(s);if(b)b.onclick=f};
  on("#rj",rejectCall);on("#ac",acceptCall);on("#en",()=>endCall(true));
  on("#mu",()=>{c.muted=!c.muted;c.st?.getAudioTracks().forEach(t=>t.enabled=!c.muted);paint(c)});
  on("#cm",()=>{if(c.type!=="video"){toast("هذه مكالمة صوتية");return}c.camOff=!c.camOff;c.st.getVideoTracks().forEach(t=>t.enabled=!c.camOff);paint(c)});
  on("#sp",()=>toast("مخرج الصوت (سماعة/مكبر) يتحكم به نظام الجهاز"));on("#mo",()=>toast("قريباً"));on("#ex",()=>{try{document.fullscreenElement?document.exitFullscreen():c.el.requestFullscreen()}catch{}});
}
const sendIce=(c,cd)=>addDoc(collection(c.ref,"ice"),{from:me.id,c:cd}).catch(()=>{});
async function setRemote(c,desc){await c.pc.setRemoteDescription(desc);c.pend.splice(0).forEach(cd=>c.pc.addIceCandidate(cd).catch(()=>{}))}
function mkPC(c){
  const pc=c.pc=new RTCPeerConnection(ICE),rv=c.el.querySelector("#rv");
  c.st.getTracks().forEach(t=>pc.addTrack(t,c.st));
  if(c.type==="video")c.el.querySelector("#lv").srcObject=c.st;
  pc.ontrack=e=>{if(rv.srcObject!==e.streams[0])rv.srcObject=e.streams[0];rv.play?.().catch(()=>{})};
  pc.onicecandidate=e=>{if(!e.candidate)return;const cd=JSON.stringify(e.candidate);c.ready?sendIce(c,cd):c.q.push(cd)};
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;
    if(s==="connected"&&c.state!=="live"){c.state="live";c.t0=Date.now();ring(false);clearTimeout(c.to);paint(c);c.timer=setInterval(()=>{const e=c.el.querySelector("#tm");if(e)e.textContent=fmtT(Math.floor((Date.now()-c.t0)/1000))},1000)}
    else if(s==="failed"||s==="closed")endCall(true,"انقطع الاتصال")};
  c.un.push(onSnapshot(collection(c.ref,"ice"),s=>s.docChanges().forEach(ch=>{if(ch.type!=="added")return;const d=ch.doc.data();if(d.from===me.id)return;const cd=JSON.parse(d.c);pc.remoteDescription?pc.addIceCandidate(cd).catch(()=>{}):c.pend.push(cd)}),()=>{}));
}
async function startCall(oid,oname,type){
  if(CALL)return toast("أنت في مكالمة الآن");
  if(!window.RTCPeerConnection||!navigator.mediaDevices?.getUserMedia)return toast("المتصفح لا يدعم المكالمات");
  let st;try{st=await getMedia(type)}catch{return toast("اسمح بالميكروفون"+(type==="video"?" والكاميرا":"")+" من الإعدادات")}
  const c=CALL={ref:doc(collection(db,"calls")),oid,oname,type,role:"out",st,state:"calling",q:[],pend:[],un:[],ready:false};
  callEl(c);paint(c);mkPC(c);
  try{const of=await c.pc.createOffer();await c.pc.setLocalDescription(of);
    await setDoc(c.ref,{from:me.id,to:oid,fromName:me.name,type,status:"ringing",offer:{type:of.type,sdp:of.sdp},ts:serverTimestamp()});
    c.ready=true;c.q.splice(0).forEach(cd=>sendIce(c,cd))}catch{endCall(false,"تعذر بدء المكالمة");return}
  c.un.push(onSnapshot(c.ref,async s=>{const d=s.data();if(!d||CALL!==c)return;
    if(d.answer&&!c.gotAns){c.gotAns=1;try{await setRemote(c,d.answer)}catch{}}
    if(d.status==="rejected")endCall(false,"تم رفض المكالمة");
    else if(d.status==="ended")endCall(false,c.state==="live"?"انتهت المكالمة":"لم يتم الرد")},()=>{}));
  c.to=setTimeout(()=>{if(c.state==="calling")endCall(true,"لم يتم الرد")},45000);
}
function incoming(id,d){
  const c=CALL={ref:doc(db,"calls",id),oid:d.from,oname:d.fromName,type:d.type,role:"in",offer:d.offer,state:"in",q:[],pend:[],un:[],ready:true};
  callEl(c);paint(c);ring(true);
  c.un.push(onSnapshot(c.ref,s=>{const x=s.data();if(CALL===c&&x&&x.status==="ended"&&c.state==="in")endCall(false,"مكالمة فائتة من "+c.oname)},()=>{}));
  c.to=setTimeout(()=>{if(CALL===c&&c.state==="in")rejectCall()},45000);
}
async function acceptCall(){
  const c=CALL;if(!c)return;ring(false);clearTimeout(c.to);
  try{c.st=await getMedia(c.type)}catch{toast("اسمح بالميكروفون من الإعدادات");return rejectCall()}
  c.state="calling";c.msg="جاري الربط…";paint(c);mkPC(c);
  try{await setRemote(c,c.offer);const an=await c.pc.createAnswer();await c.pc.setLocalDescription(an);
    await updateDoc(c.ref,{answer:{type:an.type,sdp:an.sdp},status:"accepted"})}catch{endCall(true,"تعذر قبول المكالمة")}
}
function rejectCall(){const c=CALL;if(!c)return;updateDoc(c.ref,{status:"rejected"}).catch(()=>{});endCall(false)}
function endCall(notify,msg){
  const c=CALL;if(!c)return;CALL=null;ring(false);clearInterval(c.timer);clearTimeout(c.to);
  c.un.forEach(f=>f());try{c.pc?.close()}catch{}c.st?.getTracks().forEach(t=>t.stop());c.el.remove();
  if(notify)updateDoc(c.ref,{status:"ended"}).catch(()=>{});
  if(c.role==="out")logCall(c.oid,c.oname,c.type,c.t0?Math.floor((Date.now()-c.t0)/1000):0);
  if(msg)toast(msg);
}
async function compress(file){
  const url=URL.createObjectURL(file),im=new Image();
  await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=url});
  let w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,1280/Math.max(w,h)),q=.82,out;
  for(let i=0;i<8;i++){
    const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    out=c.toDataURL("image/jpeg",q);if(out.length<650000)break;q-=.08;sc*=.85;
  }
  URL.revokeObjectURL(url);
  if(out.length>690000)throw 0;return out;
}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
